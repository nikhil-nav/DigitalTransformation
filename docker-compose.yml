services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - dt-data:/app/data
    environment:
      - DT_DATA_DIR=/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  dt-data:
