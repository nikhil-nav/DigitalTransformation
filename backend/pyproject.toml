[project]
name = "backend"
version = "0.1.0"
description = "Digital Transformation Platform API"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy>=2.0",
    "anthropic>=0.40",
    "openai>=1.50",
    "pypdf>=5.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "rapidfuzz>=3.0",
    "phonenumbers>=8.13",
    "dateparser>=1.2",
    "jellyfish>=1.0",
    "unidecode>=1.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
